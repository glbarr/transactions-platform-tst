name: transactions_platform
version: "1.0.0"
config-version: 2
 
profile: transactions_platform
 
model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
 
target-path: "target"
clean-targets: ["target", "dbt_packages"]
 
models:
  transactions_platform:
    staging:
      +materialized: view
      +schema: staging
    dimensions:
      +materialized: table
      +schema: transformed
    facts:
      +materialized: incremental
      +unique_key: transaction_id
      +schema: transformed
 